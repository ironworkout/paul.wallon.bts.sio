name: Tests

# Garde-fou : les 151 assertions de cdf_format_test.js tournent à chaque push/PR.
# Le script sort en code 1 dès qu'une assertion échoue, donc un test cassé bloque la CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Suite CDF / LDC / classement / palmarès / saisons
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lancer la suite de tests
        run: node cdf_format_test.js
